# In your app's pubspec.yaml
dependencies:
  camera:
    git:
      url: https://github.com/zouqingsong/flutter-packages.git
      path: packages/camera/camera
      ref: micvision
  # Add this to force Camera2 implementation
  camera_android:
    git:
      url: https://github.com/zouqingsong/flutter-packages.git
      path: packages/camera/camera_android
      ref: micvision

# Add dependency override to ensure Camera2 is used
dependency_overrides:
  camera_android_camerax:
    git:
      url: https://github.com/zouqingsong/flutter-packages.git
      path: packages/camera/camera_android
      ref: micvision
